<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kids Videos — Shia Resource Hub</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">S</span><span>Shia Resource Hub</span></a><nav><a href="resources.html">Resources</a><a href="parent-support.html">Parents</a><a href="ulema-support.html">Ulema</a></nav><button class="menu-toggle" aria-label="Menu">☰</button></div></header><main><section class="page-hero"><div class="container"><p class="eyebrow">Video-first learning</p><h1>Shia Kids Videos</h1><p>Age-aware video discovery for children, with channel and series context instead of an endless feed.</p></div></section><section class="section"><div class="container"><div class="filter-toolbar"><div><p class="filter-label">Choose age</p><div id="ageFilters" class="filters"></div></div><div><p class="filter-label">Choose topic</p><div id="topicFilters" class="filters"></div></div></div><div class="result-bar"><strong id="videoCount">Loading…</strong><button id="reset" class="text-button">Reset</button></div><div id="videoGrid" class="resource-grid" aria-live="polite"></div></div></section></main><script>const esc=s=>String(s||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));const levels={official:'Official source',recognized:'Recognized educational source','scholar-linked':'Scholar-linked',community:'Community source'};let data=[],age='All',topic='All';const card=v=>`<article class="resource-card"><div class="resource-meta"><span class="badge">${esc(v.format||'Video')}</span><span class="tag">${esc((v.ageRange||[]).join(' · '))}</span></div><div class="quality-row"><span class="quality-badge source-level ${esc(v.sourceLevel||'unknown')}">${esc(levels[v.sourceLevel]||'Source not yet assessed')}</span>${v.free?'<span class="quality-badge free">Free</span>':''}</div><h3>${esc(v.title)}</h3><p>${esc(v.description)}</p><div class="fit-note"><strong>Channel / series context</strong><ul><li>${esc(v.channel||'Channel not specified')}</li><li>${esc(v.series||'Individual video')}</li>${v.parentNote?`<li>${esc(v.parentNote)}</li>`:''}</ul></div><div class="tags">${(v.topics||[]).slice(0,4).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><div class="card-actions"><a class="resource-link" href="${esc(v.url)}" target="_blank" rel="noopener">Watch →</a></div></article>`;function render(){let x=data.filter(v=>(age==='All'||(v.ageRange||[]).includes(age))&&(topic==='All'||(v.topics||[]).includes(topic)));document.getElementById('videoCount').textContent=`${x.length} video${x.length===1?'':'s'} found`;document.getElementById('videoGrid').innerHTML=x.length?x.map(card).join(''):'<div class="empty"><h2>No videos found.</h2><p>Try another age or topic.</p></div>'}function filters(id,values,setter){const el=document.getElementById(id);el.innerHTML=['All',...values].map(x=>`<button class="filter-btn ${x==='All'?'active':''}" data-v="${esc(x)}">${esc(x)}</button>`).join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>{el.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');setter(b.dataset.v);render()})}fetch('data/kids-videos.json').then(r=>r.json()).then(x=>{data=x;filters('ageFilters',['3–5','6–8','9–12'],v=>age=v);filters('topicFilters',[...new Set(x.flatMap(v=>v.topics||[]))],v=>topic=v);render()});document.getElementById('reset').onclick=()=>{age=topic='All';location.reload()};</script></body></html>
